name: Publish npm package
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: antigravity-review-pair
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          registry-url: https://registry.npmjs.org
      - name: Verify release tag and package version
        working-directory: antigravity-review-pair
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); if(p.name !== '@matuto-ai/antigravity-psst-connector' || process.env.RELEASE_TAG !== 'v'+p.version) process.exit(1)"
      - name: Build exact release candidate
        working-directory: antigravity-review-pair
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/candidate-artifact.mjs prepare "$PWD" "$RUNNER_TEMP/antigravity-candidate" --require-clean
          echo "PSST_CANDIDATE_DIR=$RUNNER_TEMP/antigravity-candidate" >> "$GITHUB_ENV"
      - run: npm run check && npm test
        working-directory: antigravity-review-pair
      - name: Publish the verified release artifact
        run: |
          package_file="$(node scripts/candidate-artifact.mjs tarball-path "$PWD" "$PSST_CANDIDATE_DIR" --require-clean)"
          npm publish "$package_file" --access public --provenance --ignore-scripts
        working-directory: antigravity-review-pair
